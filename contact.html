<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap-grid.min.css" integrity="sha512-dOjUSaLkr6G2pwQ7ry9juX+iXw5602zg1kg8yH+guR3uSEidGyCnOEQnGlr7xwu/8WE+pVm1ZNqaIs5ETTIJQg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Contact -->
    <div class="container">
        <h2 class="text-center">Contact Us</h2>
        <div class="row">


            <div class="col-6 border berder-3 border-secondary rounded-4 py-3">
                <form action="index.html">
                    <div class="container">
                        <div class="row mb-3">
                            <div class="col-6">
                            <label for="fn" class="form-label"><i class="bi bi-person"></i>
                                Name:</label>
                            <input type="text" placeholder="Enter Name" name="fn" id="fn" class="form-control">
                        </div>
                        <br>

                        <div class="col-6">
                            <label for="ln" class="form-label"><i class="bi bi-person"></i>
                                Name:</label>
                            <input type="text" placeholder="Enter Last Name" name="ln" id="ln" class="form-control">
                        </div>
                    </div>
                        <br>

                             <div class="row mb-3">
                        <div class="col-12">
                            <label for="mail" class="form-label"><i class="bi bi-envelope"></i>
                               Email Address:</label>
                            <input type="email" id="mail" placeholder="Enter Gmail Address" name="mail" pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$" title="Please enter a valid @gmail.com address" class="form-control">
                        </div>
                    </div>
                     <div class="row mb-3">
                        <div class="col-12">
                            <label for="pass" class="form-label"><i class="bi bi-lock"></i>
                                Password:</label>
                            <input type="password" id="pass" placeholder="Enter Password" name="pass" class="form-control">
                        </div>
                    </div>
                        <br>

                          <div class="row">
                        <div class="col-12">
                            Gender
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="m" value="male">
                                <label class="form-check-label" for="m">
                                    Male
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" id="f" value="female" checked>
                                <label class="form-check-label" for="f">
                                    Female
                                </label>
                            </div>
                        </div>
                    </div>

                <br>
                    
                    <div class="row">
                        <div class="col-12 mt-3">
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </div>

                        </div>
                    </div>
                </form>
            </div>
<!-- location -->
          


        </div>
    </div>


   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
